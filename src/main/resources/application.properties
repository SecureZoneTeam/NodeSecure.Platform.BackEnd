spring.application.name=node-secure-platform
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.physical_naming_strategy=com.safezone.nodesecure.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy
springdoc.swagger-ui.path=/swagger-ui.html
jwt.secret=${JWT_SECRET:node-secure-dev-secret-key-change-me-0123456789}
jwt.expiration-days=7
iam.default-password=${IAM_DEFAULT_PASSWORD:12345678}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://securezoneteam.github.io}
