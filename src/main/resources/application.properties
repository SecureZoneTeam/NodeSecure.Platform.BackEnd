spring.application.name=nodesecure-platform
server.port=${PORT:8181}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.hibernate.naming.physical-strategy=com.safezone.nodesecure.platform.shared.infrastructure.persistence.jpa.strategy.SnakeCasePhysicalNamingStrategy

# Swagger UI -> http://localhost:8181/swagger-ui/index.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method


nodesecure.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:*}
